spring.application.name=recoversense-backend

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/recoversense}
spring.datasource.username=${DB_USERNAME:recoversense}
spring.datasource.password=${DB_PASSWORD:recoversense_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized